<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PERTHSANTA ARCADE</title>
    <style>
        :root {
            --charcoal: #121212;
            --dark-navy: #0a1128;
            --burgundy: #4a0404;
            --dark-purple: #240046;
            --warm-gold: #d4af37;
            --cream: #f8f5f2;
            --soft-gray: #8d99ae;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--charcoal);
            overflow: hidden;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            color: var(--cream);
            user-select: none;
        }

        /* CRT Menu Styling */
        #menu-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at center, var(--dark-navy) 0%, var(--charcoal) 100%);
            z-index: 100;
        }

        .crt-screen {
            position: relative;
            width: 400px;
            padding: 40px;
            background: #050505;
            border: 2px solid #222;
            border-radius: 20px;
            box-shadow: 0 0 50px rgba(0,0,0,0.8), inset 0 0 20px rgba(255,255,255,0.05);
            text-align: center;
            overflow: hidden;
        }

        /* Scanlines and VHS */
        .crt-screen::after {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 2;
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
        }

        h1 {
            font-size: 2rem;
            letter-spacing: 4px;
            color: var(--warm-gold);
            text-transform: uppercase;
            margin-bottom: 5px;
            text-shadow: 2px 2px 0px var(--burgundy);
        }

        h2 {
            font-size: 1rem;
            color: var(--soft-gray);
            letter-spacing: 2px;
            margin-bottom: 30px;
        }

        .menu-btn {
            display: block;
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            background: transparent;
            border: 1px solid var(--soft-gray);
            color: var(--cream);
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .menu-btn:hover {
            background: var(--warm-gold);
            color: var(--charcoal);
            border-color: var(--warm-gold);
        }

        .menu-btn.locked {
            opacity: 0.5;
            cursor: not-allowed;
            border-style: dashed;
        }

        /* Game UI */
        #game-ui {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 20px;
            box-sizing: border-box;
            display: none;
            justify-content: space-between;
            z-index: 50;
            pointer-events: none;
        }

        .ui-text {
            font-size: 1.2rem;
            font-weight: bold;
            text-shadow: 1px 1px 3px #000;
            letter-spacing: 1px;
        }

        /* Share Screen */
        #share-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 17, 40, 0.9);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 150;
        }

        .score-card {
            background: var(--charcoal);
            border: 1px solid var(--warm-gold);
            padding: 40px;
            border-radius: 10px;
            text-align: center;
            width: 350px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        .score-card h2 { color: var(--warm-gold); font-size: 1.8rem; margin-bottom: 20px; text-shadow: none; }
        .stat-row { display: flex; justify-content: space-between; margin: 10px 0; border-bottom: 1px solid #333; padding-bottom: 5px; }
        
        .share-btn {
            margin-top: 25px;
            background: #fff;
            color: #000;
            border: none;
            padding: 15px 20px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            border-radius: 5px;
        }
        .share-btn:hover { background: #e0e0e0; }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

    <!-- Main Menu -->
    <div id="menu-container">
        <div class="crt-screen">
            <h1>PERTH SANTA</h1>
            <h2>ARCADE</h2>
            <button class="menu-btn" onclick="startGame(0)">1. Love You Teacher</button>
            <button class="menu-btn" onclick="startGame(1)">2. Perfect 10 Liners</button>
            <button class="menu-btn" onclick="startGame(2)">3. Real Life</button>
            <button class="menu-btn locked" onclick="alert('COMING SOON')">4. Heartbound (Locked)</button>
        </div>
    </div>

    <!-- HUD -->
    <div id="game-ui">
        <div class="ui-text" id="ui-left">
            LIVES: <span id="lives-display">3</span><br>
            COINS: <span id="coins-display">0</span>
        </div>
        <div class="ui-text" id="ui-center" style="text-align: center; color: var(--warm-gold);">
            <span id="world-display">WORLD 1</span>
        </div>
        <div class="ui-text" id="ui-right" style="text-align: right;">
            TIME: <span id="time-display">0.00</span>
        </div>
    </div>

    <!-- End Screen -->
    <div id="share-screen">
        <div class="score-card">
            <h2>MISSION COMPLETE</h2>
            <div class="stat-row"><span>World:</span> <span id="stat-world">Love You Teacher</span></div>
            <div class="stat-row"><span>Time:</span> <span id="stat-time">0.00s</span></div>
            <div class="stat-row"><span>Coins:</span> <span id="stat-coins">0</span></div>
            <button class="share-btn" onclick="shareOnX()">SHARE ON X</button>
            <button class="menu-btn" style="margin-top: 10px; border-color: #333;" onclick="returnToMenu()">MAIN MENU</button>
        </div>
    </div>

    <canvas id="gameCanvas"></canvas>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    // UI Elements
    const menuContainer = document.getElementById('menu-container');
    const gameUI = document.getElementById('game-ui');
    const shareScreen = document.getElementById('share-screen');
    const timeDisplay = document.getElementById('time-display');
    const livesDisplay = document.getElementById('lives-display');
    const coinsDisplay = document.getElementById('coins-display');
    const worldDisplay = document.getElementById('world-display');

    let animationId;
    let gameState = 'menu'; // menu, playing, dead, complete
    
    // Physics & Camera
    const gravity = 0.6;
    const friction = 0.8;
    const accel = 1.2;
    const maxSpeed = 7;
    const jumpForce = -12;
    
    let camera = { x: 0, y: 0 };
    
    // Game Data
    let lives = 3;
    let coins = 0;
    let startTime = 0;
    let elapsedTime = 0;
    let currentWorldIndex = 0;
    
    // Input
    const keys = { left: false, right: false, up: false, down: false };
    
    window.addEventListener('keydown', e => {
        if(e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = true;
        if(e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = true;
        if(e.code === 'ArrowUp' || e.code === 'KeyW' || e.code === 'Space') keys.up = true;
        if(e.code === 'ArrowDown' || e.code === 'KeyS') keys.down = true;
    });
    
    window.addEventListener('keyup', e => {
        if(e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = false;
        if(e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = false;
        if(e.code === 'ArrowUp' || e.code === 'KeyW' || e.code === 'Space') keys.up = false;
        if(e.code === 'ArrowDown' || e.code === 'KeyS') keys.down = false;
    });

    // Resize
    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // Player Object
    const player = {
        x: 100, y: 300,
        width: 30, height: 60,
        vx: 0, vy: 0,
        grounded: false,
        coyoteTimer: 0,
        jumpBufferTimer: 0,
        scaleX: 1, scaleY: 1, // For squash and stretch
        spawnX: 100, spawnY: 300,
        
        update() {
            // Horizontal Movement
            if (keys.left) this.vx -= accel;
            if (keys.right) this.vx += accel;
            this.vx *= friction;
            
            // Limit speed
            if (this.vx > maxSpeed) this.vx = maxSpeed;
            if (this.vx < -maxSpeed) this.vx = -maxSpeed;
            
            this.x += this.vx;
            
            // Gravity & Vertical
            this.vy += gravity;
            this.y += this.vy;
            
            // Timers
            if (this.grounded) {
                this.coyoteTimer = 10; // Frames of grace
            } else {
                this.coyoteTimer--;
            }
            
            if (keys.up) {
                this.jumpBufferTimer = 8;
                keys.up = false; // Prevent holding jump
            } else {
                this.jumpBufferTimer--;
            }
            
            // Jump Logic
            if (this.jumpBufferTimer > 0 && this.coyoteTimer > 0) {
                this.vy = jumpForce;
                this.coyoteTimer = 0;
                this.jumpBufferTimer = 0;
                this.grounded = false;
                
                // Jump Stretch
                this.scaleX = 0.7;
                this.scaleY = 1.3;
                createParticles(this.x + this.width/2, this.y + this.height, '#fff', 5);
            }

            // Variable jump height (release early to fall faster)
            if (this.vy < 0 && !keys.up && this.jumpBufferTimer <= 0) {
                this.vy *= 0.8; 
            }

            // Animate Scale back to 1 (Spring effect)
            this.scaleX += (1 - this.scaleX) * 0.2;
            this.scaleY += (1 - this.scaleY) * 0.2;
            
            this.grounded = false;
        },
        
        draw(ctx) {
            ctx.save();
            ctx.translate(this.x + this.width/2, this.y + this.height);
            ctx.scale(this.scaleX, this.scaleY);
            
            // Stylish character drawing (proper shapes, soft shadows)
            ctx.shadowColor = 'rgba(0,0,0,0.5)';
            ctx.shadowBlur = 10;
            ctx.fillStyle = '#f8f5f2'; // Cream
            
            // Body (rounded)
            ctx.beginPath();
            ctx.roundRect(-this.width/2, -this.height, this.width, this.height, 10);
            ctx.fill();
            
            // Scarf/Accent (Burgundy)
            ctx.fillStyle = '#4a0404';
            ctx.fillRect(-this.width/2, -this.height + 15, this.width, 10);
            
            ctx.restore();
        },
        
        die() {
            lives--;
            livesDisplay.innerText = lives;
            if (lives <= 0) {
                // Game Over - Restart Level entirely
                resetStage();
            } else {
                // Respawn at Checkpoint
                this.x = this.spawnX;
                this.y = this.spawnY;
                this.vx = 0;
                this.vy = 0;
            }
        }
    };

    // Level Designs
    const worlds = [
        {
            name: "LOVE YOU TEACHER",
            bgColors: ["#0a1128", "#121212"], // Dark Navy to Charcoal
            length: 4000,
            platforms: [
                {x: 0, y: window.innerHeight - 100, w: 1200, h: 200},
                {x: 1300, y: window.innerHeight - 150, w: 800, h: 200},
                {x: 2300, y: window.innerHeight - 250, w: 400, h: 50}, // Desk jump
                {x: 2900, y: window.innerHeight - 100, w: 1200, h: 200},
            ],
            obstacles: [
                {x: 800, y: window.innerHeight - 140, w: 40, h: 40}, // School bag
                {x: 1700, y: window.innerHeight - 250, w: 30, h: 100} // Locker door
            ],
            coins: [{x: 900, y: window.innerHeight - 250, collected: false}, {x: 2450, y: window.innerHeight - 350, collected: false}, {x: 3100, y: window.innerHeight - 200, collected: false}],
            finish: {x: 3800, y: window.innerHeight - 300, w: 100, h: 200}
        },
        {
            name: "PERFECT 10 LINERS",
            bgColors: ["#240046", "#121212"], // Dark Purple to Charcoal
            length: 4500,
            platforms: [
                {x: 0, y: window.innerHeight - 100, w: 1000, h: 200},
                {x: 1200, y: window.innerHeight - 200, w: 600, h: 50}, // Blueprint tables
                {x: 2000, y: window.innerHeight - 300, w: 500, h: 50},
                {x: 2700, y: window.innerHeight - 100, w: 2000, h: 200},
            ],
            obstacles: [
                {x: 600, y: window.innerHeight - 150, w: 50, h: 50}, // Tool box
                {x: 2900, y: window.innerHeight - 180, w: 60, h: 80}
            ],
            coins: [{x: 1400, y: window.innerHeight - 300, collected: false}, {x: 2200, y: window.innerHeight - 400, collected: false}],
            finish: {x: 4200, y: window.innerHeight - 300, w: 100, h: 200}
        },
        {
            name: "REAL LIFE",
            bgColors: ["#4a0404", "#0a1128"], // Burgundy to Dark Navy
            length: 5000,
            platforms: [
                {x: 0, y: window.innerHeight - 100, w: 1500, h: 200},
                {x: 1700, y: window.innerHeight - 150, w: 500, h: 200},
                {x: 2400, y: window.innerHeight - 250, w: 300, h: 50},
                {x: 2900, y: window.innerHeight - 100, w: 2500, h: 200},
            ],
            obstacles: [
                {x: 1000, y: window.innerHeight - 180, w: 120, h: 80}, // Tuk tuk silhouette
                {x: 3200, y: window.innerHeight - 160, w: 60, h: 60} // Street sign
            ],
            coins: [{x: 1100, y: window.innerHeight - 300, collected: false}, {x: 2500, y: window.innerHeight - 350, collected: false}, {x: 3500, y: window.innerHeight - 200, collected: false}],
            finish: {x: 4700, y: window.innerHeight - 300, w: 100, h: 200}
        }
    ];

    let currentWorld;
    let particles = [];

    // Particle System
    function createParticles(x, y, color, count) {
        for(let i=0; i<count; i++) {
            particles.push({
                x: x, y: y,
                vx: (Math.random() - 0.5) * 4,
                vy: (Math.random() - 1) * 4,
                life: 1,
                color: color
            });
        }
    }

    function drawParticles() {
        for(let i=particles.length-1; i>=0; i--) {
            let p = particles[i];
            p.x += p.vx;
            p.y += p.vy;
            p.life -= 0.05;
            
            ctx.globalAlpha = p.life;
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.arc(p.x, p.y, 3, 0, Math.PI*2);
            ctx.fill();
            ctx.globalAlpha = 1;

            if (p.life <= 0) particles.splice(i, 1);
        }
    }

    // AABB Collision
    function checkCollisions() {
        // Platforms
        for (let plat of currentWorld.platforms) {
            // Falling onto platform
            if (player.vy > 0 && 
                player.x + player.width > plat.x && 
                player.x < plat.x + plat.w &&
                player.y + player.height >= plat.y && 
                player.y + player.height - player.vy <= plat.y + 10) {
                
                // Landing Squash
                if (player.vy > 3) {
                    player.scaleX = 1.3;
                    player.scaleY = 0.7;
                    createParticles(player.x + player.width/2, plat.y, '#8d99ae', 5);
                }
                
                player.grounded = true;
                player.y = plat.y - player.height;
                player.vy = 0;
            }
        }

        // Obstacles (Death)
        for (let obs of currentWorld.obstacles) {
            if (player.x < obs.x + obs.w && player.x + player.width > obs.x &&
                player.y < obs.y + obs.h && player.y + player.height > obs.y) {
                player.die();
            }
        }

        // Coins
        for (let c of currentWorld.coins) {
            if (!c.collected) {
                let dist = Math.hypot(player.x + player.width/2 - c.x, player.y + player.height/2 - c.y);
                if (dist < 40) {
                    c.collected = true;
                    coins++;
                    coinsDisplay.innerText = coins;
                    createParticles(c.x, c.y, '#d4af37', 15);
                }
            }
        }

        // Finish Line
        let f = currentWorld.finish;
        if (player.x < f.x + f.w && player.x + player.width > f.x &&
            player.y < f.y + f.h && player.y + player.height > f.y) {
            levelComplete();
        }

        // Fall into void
        if (player.y > window.innerHeight + 100) {
            player.die();
        }
    }

    // Background Rendering (Parallax & Shapes)
    function drawWorld() {
        // Gradient BG
        let grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
        grad.addColorStop(0, currentWorld.bgColors[0]);
        grad.addColorStop(1, currentWorld.bgColors[1]);
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Slow Clouds (Parallax layer)
        ctx.fillStyle = 'rgba(255,255,255,0.03)';
        for(let i=0; i<10; i++) {
            ctx.beginPath();
            ctx.arc(((i * 400) - camera.x * 0.2) % (currentWorld.length), 150 + Math.sin(i)*50, 80, 0, Math.PI*2);
            ctx.fill();
        }

        ctx.save();
        ctx.translate(-camera.x, -camera.y);

        // Platforms (Premium shapes, soft corners)
        ctx.shadowColor = '#000';
        ctx.shadowBlur = 15;
        for (let plat of currentWorld.platforms) {
            ctx.fillStyle = '#1a1a1a';
            ctx.beginPath();
            ctx.roundRect(plat.x, plat.y, plat.w, plat.h, 5);
            ctx.fill();
            // Top highlight
            ctx.fillStyle = '#333';
            ctx.fillRect(plat.x, plat.y, plat.w, 4);
        }
        ctx.shadowBlur = 0;

        // Obstacles (Dark Burgundy danger elements)
        for (let obs of currentWorld.obstacles) {
            ctx.fillStyle = 'var(--burgundy)';
            ctx.beginPath();
            ctx.roundRect(obs.x, obs.y, obs.w, obs.h, 3);
            ctx.fill();
        }

        // Coins (Warm Gold, glowing)
        ctx.shadowColor = 'var(--warm-gold)';
        ctx.shadowBlur = 10;
        for (let c of currentWorld.coins) {
            if (!c.collected) {
                ctx.fillStyle = 'var(--warm-gold)';
                ctx.beginPath();
                ctx.arc(c.x, c.y + Math.sin(Date.now()/200)*5, 12, 0, Math.PI*2);
                ctx.fill();
            }
        }
        ctx.shadowBlur = 0;

        // Finish Line
        ctx.fillStyle = 'rgba(255,255,255,0.1)';
        ctx.fillRect(currentWorld.finish.x, currentWorld.finish.y, currentWorld.finish.w, currentWorld.finish.h);
        ctx.fillStyle = '#fff';
        ctx.font = '20px Arial';
        ctx.fillText("GOAL", currentWorld.finish.x + 20, currentWorld.finish.y - 20);

        player.draw(ctx);
        drawParticles();

        ctx.restore();
    }

    // Main Game Loop
    function loop() {
        if (gameState !== 'playing') return;
        
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Update Time
        elapsedTime = (Date.now() - startTime) / 1000;
        timeDisplay.innerText = elapsedTime.toFixed(2);

        player.update();
        checkCollisions();

        // Smooth Camera Follow
        let targetCamX = player.x - canvas.width / 3;
        if (targetCamX < 0) targetCamX = 0;
        if (targetCamX > currentWorld.length - canvas.width) targetCamX = currentWorld.length - canvas.width;
        
        camera.x += (targetCamX - camera.x) * 0.1; // Easing

        drawWorld();

        animationId = requestAnimationFrame(loop);
    }

    // Controls
    function startGame(worldIndex) {
        currentWorldIndex = worldIndex;
        resetStage();
        
        menuContainer.style.display = 'none';
        gameUI.style.display = 'flex';
        shareScreen.style.display = 'none';
        
        worldDisplay.innerText = currentWorld.name;
        gameState = 'playing';
        loop();
    }

    function resetStage() {
        // Deep copy world structure to reset coins safely
        currentWorld = JSON.parse(JSON.stringify(worlds[currentWorldIndex]));
        
        lives = 3;
        coins = 0;
        livesDisplay.innerText = lives;
        coinsDisplay.innerText = coins;
        
        player.x = 100;
        player.y = 200;
        player.vx = 0;
        player.vy = 0;
        camera.x = 0;
        
        startTime = Date.now();
    }

    function levelComplete() {
        gameState = 'complete';
        cancelAnimationFrame(animationId);
        
        document.getElementById('stat-world').innerText = currentWorld.name;
        document.getElementById('stat-time').innerText = elapsedTime.toFixed(2) + "s";
        document.getElementById('stat-coins').innerText = coins;
        
        gameUI.style.display = 'none';
        shareScreen.style.display = 'flex';
    }

    function returnToMenu() {
        shareScreen.style.display = 'none';
        menuContainer.style.display = 'flex';
        ctx.clearRect(0, 0, canvas.width, canvas.height);
    }

    // Twitter / X Share logic matching the prompt requirement
    function shareOnX() {
        const timeStr = elapsedTime.toFixed(2);
        const text = `I cleared ${currentWorld.name} in ${timeStr} seconds with ${coins} coins.\nCan you beat my score?\n#PerthSanta #Heartbound`;
        const url = encodeURIComponent(window.location.href);
        window.open(`https://twitter.com/intent/tweet?text=${encodeURIComponent(text)}&url=${url}`, '_blank');
    }

</script>
</body>
</html>
